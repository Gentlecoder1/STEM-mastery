[project]
name = "stem-mastery-backend"
version = "0.1.0"
description = "FastAPI backend for the STEM Mastery React Native app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "neo4j>=5.20",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    # SciBERT inference (app/services/scibert_service.py). Imported lazily at
    # runtime; tests never need them because the extractor is injected.
    # <6 keeps compatibility with the fine-tuned v4-era SciBERT weights.
    "transformers>=4.46,<6",
    "torch>=2.4",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration tests that require a reachable Neo4j database (skipped by default)",
]
