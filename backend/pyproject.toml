[project]
name = "stem-mastery-backend"
version = "0.1.0"
description = "FastAPI backend for the STEM Mastery React Native app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "neo4j>=5.20",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    # NOTE: SciBERT inference (torch/transformers) deliberately lives in the
    # separate scibert_service/ container (Cloud Run), NOT here. Keeping the
    # serverless bundle free of ML deps avoids the Vercel 250 MB / function
    # size limit. In default "remote" mode the backend only calls the
    # service over HTTP via RemoteSciBERTExtractor (httpx).
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration tests that require a reachable Neo4j database (skipped by default)",
]
